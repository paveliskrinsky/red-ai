<div class="analytics" id="analytics">
  <div class="container">
    <div class="analytics__head" data-aos="fade-up">
      <h2 class="title">Travel-расходы под контролем — <br class="analytics__br">в режиме реального времени</h2>
      <p class="subtitle analytics__subtitle">Персональные дашборды для CEO, CFO, тревел-менеджеров и HR — актуальные данные о расходах, соблюдении travel-политики, активных поездках, достигнутой экономии и прогнозе бюджета.</p>
    </div>
    <div class="analytics__slider js-analytics" data-aos="fade-up" data-aos-delay="100">
      <div class="swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide analytics__slide">
            <picture class="analytics__slide-card">
              <source media="(min-width: 798px)" srcset="media/analytics/1.webp">
              <img src="media/analytics/1-m.webp" alt="Дашборд для CEO" width="281" height="336">
            </picture>
          </div>
          <div class="swiper-slide analytics__slide">
            <picture class="analytics__slide-card">
              <img src="media/analytics/2.webp" alt="Дашборд для CFO" width="1269" height="1600">
            </picture>
          </div>
          <div class="swiper-slide analytics__slide">
            <picture class="analytics__slide-card">
              <img src="media/analytics/3.webp" alt="Дашборд для Travel Manager" width="1600" height="1330">
            </picture>
          </div>
        </div>
      </div>
      <div class="analytics__controls">
        <div class="analytics__pagination"></div>
        <div class="analytics__nav">
          <button type="button" class="analytics__nav-button analytics__nav-button_prev" aria-label="Предыдущий слайд">
            <svg width="24" height="24">
              <use href="#i_slider-prev"></use>
            </svg>
          </button>
          <button type="button" class="analytics__nav-button analytics__nav-button_next" aria-label="Следующий слайд">
            <svg width="24" height="24">
              <use href="#i_slider-next"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
