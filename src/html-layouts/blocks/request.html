<div class="request" id="demo">
  <div class="container">
    <div class="request__head" data-aos="fade-up">
      <h2 class="title request__title">Посмотрите, что Red AI сделает для вашего бизнеса</h2>
      <p class="subtitle request__subtitle">Покажем возможности платформы на сценариях вашей компании: бронирование, согласование, travel-политика, AI-автоматизация и аналитика расходов.</p>
    </div>
    <div class="request__card" data-aos="fade-up" data-aos-delay="100">
      <picture class="request__image">
        <img src="media/request/1.webp" alt="" width="1280" height="1072" loading="lazy">
      </picture>
      <form class="request__form" action="#">
        <h3 class="request__form-title">Укажите контакты — и мы свяжемся с вами в удобное время.</h3>
        <div class="request__fields">
          <label class="request__field">
            <span class="request__field-label">Ваше имя<span>*</span></span>
            <input type="text" name="name" placeholder="Введите ваше имя" required>
          </label>
          <label class="request__field request__field_half">
            <span class="request__field-label">Название компании</span>
            <input type="text" name="company" placeholder="Введите название компании">
          </label>
          <label class="request__field request__field_half">
            <span class="request__field-label">Email<span>*</span></span>
            <input type="email" name="email" placeholder="Введите рабочий email" required>
          </label>
          <label class="request__field">
            <span class="request__field-label">Телефон</span>
            <input type="tel" name="phone" placeholder="Введите ваш телефон">
          </label>
        </div>
        <label class="request__agree">
          <input type="checkbox" name="agree" checked required>
          <span class="request__agree-box">
            <svg width="20" height="20">
              <use href="#i_check"></use>
            </svg>
          </span>
          <span class="request__agree-text">Нажимая на эту кнопку, Вы даете согласие на обработку персональных данных, принимаете условия Политики обработки персональных данных и <a href="#">Пользовательского соглашения</a>.</span>
        </label>
        <button type="submit" class="button button_gradient request__button">
          Запросить демо
          <span>
            <svg width="24" height="24">
              <use href="#i_arrow-right"></use>
            </svg>
          </span>
        </button>
      </form>
    </div>
  </div>
  <div class="request__integrations" data-aos="fade" data-aos-delay="100">
    <div class="container request__integrations-inner">
      <p class="request__integrations-title">Готовые интеграции с популярными системами:</p>
