<div class="inquiry" id="contact">
  <div class="container">
    <h2 class="title inquiry__title" data-aos="fade-up">Сделайте командировки выгоднее с Red AI</h2>
    <div class="inquiry__card" data-aos="fade-up" data-aos-delay="100">
      <form class="inquiry__form" action="#">
        <h3 class="inquiry__heading">Заполните форму — и мы выйдем на связь в ближайшее время</h3>
        <div class="inquiry__fields">
          <label class="inquiry__field">
            <span class="inquiry__field-label">Ваше имя<span>*</span></span>
            <input type="text" name="name" placeholder="Введите ваше имя" required>
          </label>
          <label class="inquiry__field">
            <span class="inquiry__field-label">Название компании</span>
            <input type="text" name="company" placeholder="Введите название компании">
          </label>
          <label class="inquiry__field">
            <span class="inquiry__field-label">Email<span>*</span></span>
            <input type="email" name="email" placeholder="Введите email" required>
          </label>
          <label class="inquiry__field">
            <span class="inquiry__field-label">Телефон</span>
            <input type="tel" name="phone" placeholder="Введите ваш телефон">
          </label>
          <label class="inquiry__field">
            <span class="inquiry__field-label">Ваш запрос</span>
            <input type="text" name="message" placeholder="Введите ваш запрос">
          </label>
        </div>
        <label class="inquiry__agree">
          <input type="checkbox" name="agree" checked required>
          <span class="inquiry__agree-box">
            <svg width="20" height="20">
              <use href="#i_check"></use>
            </svg>
          </span>
          <span class="inquiry__agree-text">Нажимая на эту кнопку, Вы даете согласие на обработку персональных данных, принимаете условия Политики обработки персональных данных и <a href="#">Пользовательского соглашения</a>.</span>
        </label>
        <button type="submit" class="button button_gradient inquiry__button">Отправить</button>
      </form>
      <div class="inquiry__support">
        <h3 class="inquiry__heading">Поддержка клиентов <br>24/7</h3>
        <div class="inquiry__phone">
          <p class="inquiry__phone-label">Контактный телефон:</p>
          <a href="tel:88005516004" class="inquiry__phone-link">8&nbsp;800&nbsp;551&nbsp;60&nbsp;04</a>
        </div>
        <div class="inquiry__map">
          <iframe src="https://www.google.com/maps/embed?origin=mfe&pb=!1m3!2m1!1z0JzQvtGB0LrQstCw!6i11!3m1!1sru!5m1!1sru" title="Карта: Москва" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>
</div>
